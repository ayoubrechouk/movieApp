kind = "web"
previewPath = "/"
title = "Movie Discovery"
description = "A dark-themed movie discovery app for browsing a curated film collection, searching and filtering titles, and saving favorites across refreshes."
version = "1.0.0"
id = "artifacts/movie-discovery"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21721

[services.development]
run = "pnpm --filter @workspace/movie-discovery run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/movie-discovery", "run", "build" ]
serve = "static"
publicDir = "artifacts/movie-discovery/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21721"
BASE_PATH = "/"
